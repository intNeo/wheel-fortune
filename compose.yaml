services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run python3 setup_env.py}
      API_TOKEN: ${API_TOKEN:?Run python3 setup_env.py}
      WHEEL_ACCESS_TOKEN: ${WHEEL_ACCESS_TOKEN:-}
      WHEEL_ACCESS_TOKENS: ${WHEEL_ACCESS_TOKENS:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run python3 setup_env.py}@redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-28800}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
      LOGIN_ATTEMPTS: ${LOGIN_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      LOGIN_GLOBAL_PER_MINUTE: ${LOGIN_GLOBAL_PER_MINUTE:-60}
      SPINS_PER_MINUTE: ${SPINS_PER_MINUTE:-10}
      SPIN_BURST_PER_SECOND: ${SPIN_BURST_PER_SECOND:-2}
      SPINS_GLOBAL_PER_MINUTE: ${SPINS_GLOBAL_PER_MINUTE:-60}
      FLASK_API_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host':'localhost'}))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN:?Run python3 setup_env.py}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run python3 setup_env.py}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  redis-data:
