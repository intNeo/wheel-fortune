# Колесо фортуны: Nginx и Docker Compose на одной машине.
# Замените wheel.example.com на свой домен во всём файле.
# Сначала выпустите сертификат по инструкции в PRODUCTION.md.
#
# Файл подключается внутри http {} из nginx.conf:
#   include /etc/nginx/sites-enabled/*;
# либо:
#   include /etc/nginx/conf.d/*.conf;
# Не оборачивайте этот файл в дополнительный блок http {}.
# Объявляйте зону fortune_edge только один раз.
limit_req_zone $binary_remote_addr zone=fortune_edge:10m rate=5r/s;

server {
    listen 80;
    # listen [::]:80;
    server_name wheel.example.com;

    # HTTP-01: получение и продление сертификата через certbot --webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://wheel.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    server_name wheel.example.com;

    ssl_certificate /etc/letsencrypt/live/wheel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wheel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # Общий внешний лимит на IP, дополнительно к лимитам Django/Redis.
        limit_req zone=fortune_edge burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Перезаписываем входящие адресные заголовки посетителя.
        # Настройте TRUSTED_PROXY_CIDRS в .env приложения.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
